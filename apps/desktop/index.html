<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101216" />
    <meta name="description" content="A local control plane for coding agents." />
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search)
        const companion = params.has('companion')
        const dictation = params.has('dictation')
        if (companion) document.documentElement.classList.add('companion-surface')
        if (dictation) document.documentElement.classList.add('dictation-surface')
        try {
          const settings = JSON.parse(localStorage.getItem('bloblex.appearance') || '{}')
          const theme = ['system', 'dark', 'light'].includes(settings.theme) ? settings.theme : 'system'
          const textSize = ['small', 'default', 'large', 'larger'].includes(settings.textSize) ? settings.textSize : 'default'
          const overlay = companion || dictation
          const resolved = overlay ? 'dark' : theme === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : theme
          document.documentElement.dataset.theme = resolved
          document.documentElement.dataset.textSize = textSize
          document.documentElement.dataset.themeChoice = overlay ? 'dark' : theme
        } catch { document.documentElement.dataset.theme = 'dark' }
      })()
    </script>
    <title>Bloblex</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
