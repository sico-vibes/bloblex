[workspace]
resolver = "2"
members = [
  "crates/bloblex-protocol",
  "crates/bloblex-agent-core",
  "crates/bloblex-storage",
  "crates/bloblex-security",
  "crates/bloblex-runtime",
  "crates/bloblex-adapter-acp",
  "crates/bloblex-adapter-codex",
  "crates/bloblex-adapter-claude",
  "crates/bloblex-adapter-opencode",
  "crates/bloblex-usage",
  "crates/bloblex-budget",
  "crates/bloblex-process",
  "crates/bloblex-wsl",
  "crates/bloblex-daemon",
  "apps/desktop/src-tauri",
  "tools/bloblex-hook",
]

[workspace.package]
version = "0.1.0-beta.4"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
futures-util = "0.3"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled", "chrono", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
