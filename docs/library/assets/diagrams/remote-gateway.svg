<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" class="diagram-svg" role="img" aria-label="Remote gateway paths: Tailscale and Native, policy and in-process dispatch">
  <style>
    .c { fill: var(--dg-card, #23262f); stroke: var(--dg-line, #343743); stroke-width: 1; }
    .p { fill: var(--dg-panel, #1b1d24); stroke: var(--dg-line, #343743); stroke-width: 1; }
    .k { fill: var(--dg-accent-soft, #8d86f622); stroke: var(--dg-accent, #8d86f6); stroke-width: 1; }
    .w { fill: var(--dg-warn-soft, #f5bd5c1a); stroke: var(--dg-warn, #f5bd5c); stroke-width: 1; }
    .h { fill: var(--dg-ink, #f4f5f7); font: 600 12.5px Inter, "Segoe UI", sans-serif; }
    .t { fill: var(--dg-ink, #f4f5f7); font: 500 11.5px Inter, "Segoe UI", sans-serif; }
    .m { fill: var(--dg-muted, #9aa0ad); font: 400 11px Inter, "Segoe UI", sans-serif; }
    .a { stroke: var(--dg-accent, #8d86f6); stroke-width: 1.5; fill: none; }
    .b { stroke: var(--dg-line-strong, #4a4e5c); stroke-width: 1.2; fill: none; }
    .l { fill: var(--dg-muted, #9aa0ad); font: 400 10.5px Inter, "Segoe UI", sans-serif; }
  </style>
  <text x="18" y="22" class="l">Owner's phone or laptop</text>
  <rect x="18" y="34" width="176" height="118" rx="10" class="c"/>
  <text x="32" y="58" class="h">Remote web app</text>
  <text x="32" y="78" class="m">pairing code, then a device</text>
  <text x="32" y="96" class="m">token in an HttpOnly cookie</text>
  <text x="32" y="114" class="m">tier: viewer · chat · operator</text>
  <text x="32" y="132" class="m">Origin and Tailscale user checked</text>

  <rect x="242" y="18" width="210" height="80" rx="10" class="c"/>
  <text x="256" y="42" class="h">Tailscale method</text>
  <text x="256" y="61" class="m">tailscale serve --bg --https</text>
  <text x="256" y="78" class="m">gateway on 127.0.0.1:remote.port</text>
  <text x="256" y="93" class="m">tailnet only, never funnel</text>

  <rect x="242" y="112" width="210" height="86" rx="10" class="w"/>
  <text x="256" y="136" class="h">Native method</text>
  <text x="256" y="155" class="m">HTTPS only, generated certificate</text>
  <text x="256" y="172" class="m">binds the host's interfaces on its</text>
  <text x="256" y="188" class="m">own port (default 48621)</text>

  <path d="M194 76 H216 V58 H242" class="a"/>
  <path d="M194 120 H216 V156 H242" class="a"/>
  <text x="200" y="50" class="l">one at a time</text>

  <rect x="500" y="18" width="212" height="180" rx="14" class="p"/>
  <text x="516" y="42" class="l">Gateway inside bitbotsd</text>
  <rect x="516" y="56" width="180" height="46" rx="9" class="c"/>
  <text x="528" y="77" class="t">Authenticate every request</text>
  <text x="528" y="93" class="m">cookie, revocation, Origin</text>
  <rect x="516" y="112" width="180" height="46" rx="9" class="c"/>
  <text x="528" y="133" class="t">Abuse limits</text>
  <text x="528" y="149" class="m">per-IP, lockout, burst pause</text>
  <rect x="516" y="164" width="180" height="34" rx="9" class="c"/>
  <text x="528" y="186" class="t">Routes and the event stream</text>

  <rect x="500" y="210" width="212" height="70" rx="10" class="k"/>
  <text x="516" y="234" class="h">tiers.json policy</text>
  <text x="516" y="253" class="m">one table read by Rust and TypeScript</text>
  <text x="516" y="269" class="m">a parity test fails the build on a gap</text>

  <rect x="760" y="18" width="222" height="120" rx="10" class="c"/>
  <text x="776" y="42" class="h">dispatch() in-process</text>
  <text x="776" y="62" class="m">no capability is read or exposed</text>
  <text x="776" y="80" class="m">events filtered and redacted</text>
  <text x="776" y="98" class="m">no message text in logs or pushes</text>
  <text x="776" y="116" class="m">remote-forbidden methods refused</text>

  <rect x="760" y="156" width="222" height="124" rx="10" class="c"/>
  <text x="776" y="180" class="h">Daemon API</text>
  <text x="776" y="200" class="m">POST /v1/rpc · GET /v1/events</text>
  <text x="776" y="218" class="m">still bound to 127.0.0.1</text>
  <text x="776" y="236" class="m">capability still required</text>
  <text x="776" y="254" class="m">sessions, approvals, storage</text>
  <text x="776" y="270" class="m">Remote methods only through the gateway</text>

  <path d="M452 58 H500" class="a"/>
  <path d="M452 156 H476 V228 H500" class="a"/>
  <path d="M712 115 H736 V86 H760" class="a"/>
  <path d="M712 245 H736 V220 H760" class="b"/>
  <path d="M606 180 V210" class="a"/>
  <text x="618" y="198" class="l">method tiers</text>

  <rect x="18" y="210" width="434" height="70" rx="10" class="c"/>
  <text x="34" y="234" class="h">Never remote</text>
  <text x="34" y="253" class="m">settings.set · remote.* · bot create, update and delete · runtime profiles</text>
  <text x="34" y="269" class="m">file revert · automation and memory writes · daemon shutdown · native commands</text>

  <rect x="18" y="294" width="434" height="90" rx="10" class="c"/>
  <text x="34" y="318" class="h">Approvals from remote are off by default</text>
  <text x="34" y="337" class="m">When on, chat and operator devices may answer an approval card. Every</text>
  <text x="34" y="353" class="m">decision is attributed to the device and recorded like a local one.</text>
  <text x="34" y="371" class="m">The desktop shows the connection, the device list and a revoke action.</text>

  <rect x="500" y="294" width="482" height="90" rx="10" class="c"/>
  <text x="516" y="318" class="h">Status and safety</text>
  <text x="516" y="337" class="m">Remote is off by default and switching methods needs it off first.</text>
  <text x="516" y="353" class="m">A port held by another program moves the gateway to the next free port.</text>
  <text x="516" y="371" class="m">The Native method refuses plain HTTP and shows its certificate fingerprint.</text>
</svg>
