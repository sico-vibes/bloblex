<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101216" />
    <meta name="description" content="A local control plane for coding agents." />
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search)
        const companion = params.has('companion')
        const dictation = params.has('dictation')
        if (companion) document.documentElement.classList.add('companion-surface')
        if (dictation) document.documentElement.classList.add('dictation-surface')
        try {
          const settings = JSON.parse(localStorage.getItem('bloblex.appearance') || '{}')
          const storedStyle = localStorage.getItem('bitbots.style')
          const style = ['bitbots', 'blobots', 'legacy', 'pop', 'dot'].includes(storedStyle) ? storedStyle : 'bitbots'
          document.documentElement.dataset.style = style
          if (style === 'legacy') document.documentElement.dataset.bitbots = 'on'
          const glass = localStorage.getItem('bitbots.glass')
          document.documentElement.dataset.glass = ['solid', 'balanced', 'clear'].includes(glass) ? glass : 'solid'
          const wallpaper = localStorage.getItem('bitbots.wallpaper')
          document.documentElement.dataset.wallpaper = ['lake', 'dusk', 'bloom', 'sand', 'custom'].includes(wallpaper) ? wallpaper : 'lake'
          const queryTheme = params.get('theme')
          const theme = ['system', 'dark', 'light'].includes(queryTheme) ? queryTheme : ['system', 'dark', 'light'].includes(settings.theme) ? settings.theme : 'system'
          const textSize = ['small', 'default', 'large', 'larger'].includes(settings.textSize) ? settings.textSize : 'default'
          const overlay = companion || dictation
          const resolved = overlay ? 'dark' : theme === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : theme
          document.documentElement.dataset.theme = resolved
          document.documentElement.dataset.textSize = textSize
          document.documentElement.dataset.themeChoice = overlay ? 'dark' : theme
        } catch { document.documentElement.dataset.theme = 'dark' }
      })()
    </script>
    <title>Bitbots</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
