<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e0e" />
    <meta name="description" content="Bitbots Remote: chat with your bots from any device." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/remote.webmanifest" />
    <link rel="apple-touch-icon" href="/src/assets/bloblex-128.png" />
    <title>Bitbots Remote</title>
    <script>
      (() => {
        try {
          const light = matchMedia('(prefers-color-scheme: light)').matches
          document.documentElement.dataset.theme = light ? 'light' : 'dark'
        } catch { /* default dark */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/remote/main.tsx"></script>
  </body>
</html>
