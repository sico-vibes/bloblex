[package]
name = "bloblex-speech"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "On-device dictation engine for Bloblex (sherpa-onnx + cpal)."

[features]
default = []
# The heavy native engine. Kept off by default so the pure logic (catalog,
# resampling, chunking, lifecycle) builds and tests without a native toolchain.
native = ["dep:sherpa-onnx", "dep:cpal"]

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
cpal = { version = "0.15", optional = true }
sherpa-onnx = { version = "1.13", optional = true }

[dev-dependencies]
tempfile = "3"
