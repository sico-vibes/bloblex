name: CI

# The gates the Director runs by hand (`.claude/skills/bitbots-development/references/verification.md`),
# on every push and pull request to main. No secrets are used and the token is read-only.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Some daemon tests overflow the default test-thread stack (verification.md).
  RUST_MIN_STACK: '33554432'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  gates:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # The desktop crate is excluded below and cannot build from a path with
          # an apostrophe; nothing here needs it.
          workspaces: '.'

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and mounted tests
        run: npm test

      - name: Daemon and crate tests
        shell: pwsh
        # Two tests are known flaky under load (verification.md). They are not
        # skipped: a failed run is retried once on its own, and any other failure,
        # or a second failure, still fails the build.
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'cargo-test.log'
          cargo test --workspace --exclude bloblex-desktop --no-fail-fast 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -eq 0) { exit 0 }
          $flaky = @(
            'a_crash_after_a_finished_turn_does_not_fail_that_session',
            'stopping_a_turn_stops_its_setup_script'
          )
          $failed = @(Select-String -Path $log -Pattern '^test (\S+) \.\.\. FAILED' -CaseSensitive | ForEach-Object { $_.Matches[0].Groups[1].Value.Split('::')[-1] })
          Write-Host "failed tests: $($failed -join ', ')"
          $unexpected = @($failed | Where-Object { $flaky -notcontains $_ })
          if ($unexpected.Count -gt 0) {
            Write-Host "::error::failing tests not on the known-flaky list: $($unexpected -join ', ')"
            exit 1
          }
          foreach ($name in $failed) {
            Write-Host "retrying $name once"
            cargo test -p bloblex-daemon $name -- --exact --nocapture
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::$name failed twice"
              exit 1
            }
          }

      - name: Clippy
        run: cargo clippy --workspace --exclude bloblex-desktop --all-targets -- -D warnings

      - name: Build the production bundle
        run: npm run build

      - name: Build the phone PWA
        run: npm run build:remote --workspace @bloblex/desktop

      - name: Documentation library
        run: npm run docs:check

      - name: Build the performance-gate binaries
        run: cargo build -p bloblex-daemon --bin bitbotsd -p bloblex-storage --bin perf-seed

      - name: Performance gate
        run: npm run perf

      - name: Render budget
        run: npm run perf:render
